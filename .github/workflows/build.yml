name: Build OnePlus 8T Perf Kernel (OOS 13.1)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source
      uses: actions/checkout@v4
      with:
        ref: op8t

    - name: Setup Build Environment
      run: |
        sudo apt update
        sudo DEBIAN_FRONTEND=noninteractive apt install -y -o Dpkg::Options::="--force-confdef" -o Dpkg::Options::="--force-confold" bc bison build-essential flex git libssl-dev libelf-dev libncurses-dev libglib2.0-dev libpixman-1-dev lld python3 python3-dev wget curl

    - name: Download Google AOSP Clang
      run: |
        mkdir -p $GITHUB_WORKSPACE/toolchain
        cd $GITHUB_WORKSPACE/toolchain
        
        # Використовуємо стабільне дзеркало prebuilt-компіляторів для GitHub Actions
        curl -LOs https://github.com
        
        tar -xf Clang-12.0.5-20210512-r416183b.tar.gz
        rm -f Clang-12.0.5-20210512-r416183b.tar.gz

    - name: Neutralize Broken OnePlus Scripts
      run: |
        if [ -f scripts/gcc-wrapper.py ]; then
          echo '#!/usr/bin/env python3' > scripts/gcc-wrapper.py
          echo 'import sys, subprocess' >> scripts/gcc-wrapper.py
          echo 'subprocess.run(sys.argv[1:])' >> scripts/gcc-wrapper.py
          chmod +x scripts/gcc-wrapper.py
        fi

    - name: Build Kernel
      run: |
        # Враховуємо структуру папок архіву ZyCromerZ (бінарники лежать у bin/)
        export PATH="$GITHUB_WORKSPACE/toolchain/bin:$PATH"
        
        export ARCH=arm64
        export SUBARCH=arm64
        export CC=clang
        export LD=ld.lld
        export AR=llvm-ar
        export NM=llvm-nm
        export OBJCOPY=llvm-objcopy
        export OBJDUMP=llvm-objdump
        export STRIP=llvm-strip
        export CLANG_TRIPLE=aarch64-linux-gnu-
        export CROSS_COMPILE=aarch64-linux-gnu-
        export CROSS_COMPILE_ARM32=arm-linux-gnueabi-

        # 1. Генерація конфігурації
        make O=out vendor/kebab_perf_defconfig

        # 2. Оновлення конфігурації
        make O=out olddefconfig

        # 3. Компіляція ядра
        make -j$(nproc) O=out KCFLAGS="-w"

    - name: Upload Kernel Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Perf-Kernel-OOS13.1-kebab
        path: |
          out/arch/arm64/boot/Image
          out/arch/arm64/boot/Image-dtb
          out/arch/arm64/boot/dtbo.img
